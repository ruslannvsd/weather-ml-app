# CI.yml - Continuous Integration for weather-ml-app (CW2 Tasks 4(a) to 4(f))

name: CI

env:
  IMAGE: katerynas82/weather-ml-app:v1

# 4(a) Detect changes to the GitHub repository
on:
  push:
    branches: [main, bugfix]
  pull_request:
    branches: [main]
  workflow_dispatch: {}          # "Run workflow" button in the Actions tab

jobs:
  build-test-push:
    name: Test, build and push image
    runs-on: ubuntu-24.04      # Python 3.9 is not built for Ubuntu 26.04 (ubuntu-latest)

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Same Python as the Dockerfile (python:3.9-slim). model/model.pkl was
      # saved with scikit-learn 1.6.1, the last release that supports Python 3.9.
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      # 4(b) Install Flask and the dependencies in requirements.txt
      - name: Install Flask and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          pip install -r requirements.txt
          pip list
          
      # 4(c) Run each test file in its own step, in order.
      # "python -m unittest" runs from the repo root so "from app import app" works.
      - name: Smoke test
        run: python -m unittest -v tests/smoke_test.py

      - name: Unit test
        run: python -m unittest -v tests/unit_test.py

      - name: Integration test
        run: python -m unittest -v tests/integration_test.py
        
      # 4(d) Build a Docker image from the Dockerfile
      - name: Build Docker image
        run: docker build -t $IMAGE .

      # 4(e) Build test: start a container and run a command inside it
      - name: Build test
        run: |
          docker run -d --name buildtest $IMAGE
          sleep 5
          docker ps
          docker exec buildtest python -c "import flask; print('Container is running')"
          docker rm -f buildtest
